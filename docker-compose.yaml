# 開発・評価用のデータ保存先 PostgreSQL。
#
# 設計 §2.4 / §5 / §4.7.1 に対応するカスタムイメージ（pg_bigm + ltree 同梱）を
# docker/postgres/Dockerfile からビルドして起動する。
#
# 使い方:
#   docker compose up -d            # 初回はイメージをビルドして起動
#   docker compose up -d --build    # Dockerfile 変更時に再ビルド
#   docker compose down             # 停止（データは名前付きボリュームに残る）
#   docker compose down -v          # データごと破棄
#
# 接続情報・ポートは .env（.env.example を参照）で上書きできる。
#
# 取り込みワーカー（Procrastinate）・再提供 API・MCP サーバーも同梱する:
#   docker compose up -d --build    # postgres + migrate(Alembic) + worker + api + mcp
# worker は日次 03:00 に差分を自動取り込みする（§10-5）。手動投入は:
#   uv run laws-ingest enqueue-delta --update-date YYYYMMDD
# api は v2 互換 API（http://localhost:8000）。mcp は法令検索 MCP サーバー
#   （Streamable HTTP, http://localhost:8765/mcp）で api を HTTP 経由で呼ぶ。

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: laws-api-mirror-app:dev
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-laws}:${POSTGRES_PASSWORD:-laws}@postgres:5432/${POSTGRES_DB:-laws}
    TZ: Asia/Tokyo

services:
  postgres:
    build:
      context: ./docker/postgres
    image: laws-api-mirror-pg:16
    container_name: laws-api-mirror-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laws}
      POSTGRES_DB: ${POSTGRES_DB:-laws}
      TZ: Asia/Tokyo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laws} -d ${POSTGRES_DB:-laws}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # スキーマ適用（Alembic）を 1 回だけ実行して終了する。
  migrate:
    <<: *app
    container_name: laws-api-mirror-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # 取り込みワーカー（Procrastinate）。マイグレーション完了後に常駐起動する。
  worker:
    <<: *app
    container_name: laws-api-mirror-worker
    command: ["laws-ingest", "worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 再提供 API（v2 互換）。マイグレーション完了後に起動する。
  api:
    <<: *app
    container_name: laws-api-mirror-api
    command:
      ["uvicorn", "laws_api_mirror.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 法令検索 MCP サーバー（Streamable HTTP）。api を HTTP 経由で呼ぶ薄いプロキシ。
  mcp:
    <<: *app
    container_name: laws-api-mirror-mcp
    command: ["laws-mcp"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-laws}:${POSTGRES_PASSWORD:-laws}@postgres:5432/${POSTGRES_DB:-laws}
      TZ: Asia/Tokyo
      # コンテナ間通信先・全インタフェース待受に上書きする
      API_BASE_URL: http://api:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
    ports:
      - "${MCP_PORT:-8765}:8765"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
