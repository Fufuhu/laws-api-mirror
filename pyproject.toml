[project]
name = "laws-api-mirror"
version = "0.0.1"
description = "e-Gov 法令API v2 互換ミラーサーバー (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.47",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "lxml>=5.3",
    "fugashi[unidic-lite]>=1.3",
]

[project.scripts]
laws-api-mirror = "laws_api_mirror.__main__:main"
laws-ingest = "laws_api_mirror.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laws_api_mirror"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "ruff>=0.15",
    "mypy>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic の自動生成リビジョンは生成器の整形に従うため lint 対象外にする
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# 日本語コメント・文字列中の全角記号（（）：等）を曖昧 Unicode として誤検知するため無効化
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI の依存性注入（引数デフォルトでの Depends 呼び出し）は定石のため B008 の対象外にする
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lxml.*", "fugashi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
